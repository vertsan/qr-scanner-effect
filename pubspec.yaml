name: qr_scan_fx
description: >-
  Premium, canvas-drawn QR scanner overlay for Flutter: focus frames, corner
  brackets, scan beams, spring lock-on, success effects, banking mode.
version: 0.1.0
repository: https://github.com/vertsan/qr-scanner-effect
issue_tracker: https://github.com/vertsan/qr-scanner-effect/issues
topics:
  - qr
  - scanner
  - animation
  - ui
  - camera

screenshots:
  - description: The dark theme while scanning, with the beam mid-sweep.
    path: screenshots/hero_dark_scanning.png
  - description: The dark theme locked onto a target after the spring settles.
    path: screenshots/hero_dark_locked.png
  - description: The success burst in the dark theme.
    path: screenshots/hero_dark_success.png
  - description: Banking mode — calm, neutral, and free of particles and glitch.
    path: screenshots/hero_banking_locked.png
  - description: Banking mode reporting an unreadable code, with a retry prompt.
    path: screenshots/hero_banking_invalid.png
  - description: The cyberpunk recipe — electric cyan and violet with a hard beam.
    path: screenshots/recipe_cyberpunk_locked.png
  - description: The appleVision recipe — a soft squircle frame over a follow-spot.
    path: screenshots/recipe_apple_vision_locked.png
  - description: The retroLaser recipe — a straight-edged frame and a scanline.
    path: screenshots/recipe_retro_laser_locked.png
  - description: The playfulPop recipe — capsule corners and a pulse-ring beam.
    path: screenshots/recipe_playful_pop_locked.png

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  # Used by `lib/main.dart`, the package's own demo. Both are dev dependencies
  # on purpose, so the published package still ships with no runtime
  # dependencies of its own.
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2

flutter:
  uses-material-design: true
